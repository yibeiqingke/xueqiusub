<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gold-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Rounded Gradient App Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#ai-bg)" />
  
  <!-- Financial Growth Trend Path -->
  <polyline points="12,46 25,35 36,41 52,18" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arrow Head -->
  <polyline points="40,18 52,18 52,30" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data Node Points -->
  <circle cx="25" cy="35" r="3.2" fill="#ffffff" />
  <circle cx="36" cy="41" r="3.2" fill="#ffffff" />
  
  <!-- AI Sparkle at Peak -->
  <circle cx="52" cy="18" r="4.5" fill="url(#gold-spark)" stroke="#ffffff" stroke-width="1.5" />
</svg>
