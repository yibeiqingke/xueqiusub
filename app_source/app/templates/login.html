{% extends "base.html" %}
{% block title %}登录 · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <section class="auth-panel">
    <div class="auth-panel-header">
      <div class="auth-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>
      <h1>欢迎登录</h1>
      <p>{{ app_name }} · 全网财经大V动态监控与 AI 投研推送平台</p>
    </div>

    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        <span>用户名或注册邮箱</span>
        <input type="text" name="email" autocomplete="username" placeholder="请输入用户名或邮箱" required autofocus>
      </label>
      <label>
        <span>登录密码</span>
        <input type="password" name="password" autocomplete="current-password" placeholder="请输入您的密码" required>
      </label>
      <button type="submit" style="width: 100%; height: 44px; font-size: 15px; margin-top: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
        <span>立即登录</span>
      </button>
    </form>

    <div class="alt-link">
      <span>忘记密码？</span>
      <a href="/forgot-password">重置密码</a>
    </div>

    <div class="alt-link">
      <span>还没有账号？</span>
      <a href="/register">免费注册</a>
    </div>
  </section>
</div>
{% endblock %}
