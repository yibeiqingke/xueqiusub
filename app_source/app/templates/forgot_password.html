{% extends "base.html" %}
{% block title %}重置密码 · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <section class="auth-panel">
    <div class="auth-panel-header">
      <div class="auth-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>找回密码</h1>
      <p>输入你的用户名或注册邮箱，系统将发送重置链接</p>
    </div>

    <form method="post" action="/forgot-password" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        <span>用户名或注册邮箱</span>
        <input type="text" name="ident" autocomplete="username" placeholder="请输入注册时的用户名或邮箱" required autofocus>
      </label>
      <button type="submit" style="width: 100%; height: 44px; font-size: 15px; margin-top: 6px;">
        <span>发送重置邮件</span>
      </button>
    </form>

    <div class="alt-link">
      <span>想起来了？</span>
      <a href="/login">返回登录</a>
    </div>
  </section>
</div>
{% endblock %}
