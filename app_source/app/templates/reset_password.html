{% extends "base.html" %}
{% block title %}设置新密码 · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <section class="auth-panel">
    <div class="auth-panel-header">
      <div class="auth-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
      </div>
      <h1>设置新密码</h1>
      <p>为账号 {{ app_name }} 设置一个新的登录密码</p>
    </div>

    <form method="post" action="/reset-password/{{ reset_token }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        <span>新密码（至少 6 位）</span>
        <input type="password" name="password" autocomplete="new-password" minlength="6" required autofocus>
      </label>
      <label>
        <span>确认新密码</span>
        <input type="password" name="confirm" autocomplete="new-password" minlength="6" required>
      </label>
      <button type="submit" style="width: 100%; height: 44px; font-size: 15px; margin-top: 6px;">
        <span>确认重置</span>
      </button>
    </form>

    <div class="alt-link">
      <span>链接已过期？</span>
      <a href="/forgot-password">重新申请</a>
    </div>
  </section>
</div>
{% endblock %}
