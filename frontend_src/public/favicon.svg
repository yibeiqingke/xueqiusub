<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>
  <line x1="80" y1="260" x2="432" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Financial Uptrend Line with Glow -->
  <path d="M 96 370 Q 180 340 220 280 T 330 220 T 416 130" fill="none" stroke="url(#line)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Uptrend Arrowhead -->
  <polygon points="416,110 436,150 396,150" fill="#f59e0b" transform="rotate(38 416 130)"/>
  
  <!-- Data Nodes -->
  <circle cx="220" cy="280" r="14" fill="#38bdf8"/>
  <circle cx="330" cy="220" r="14" fill="#10b981"/>
  <circle cx="416" cy="130" r="16" fill="#f59e0b"/>
</svg>
